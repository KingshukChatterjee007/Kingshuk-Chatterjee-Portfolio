  </defs>
  
  <!-- Rich Dark Rounded Canvas matching theme bg-darker -->
  <rect width="100" height="100" rx="24" fill="#050508" />
  
  <g fill="none" stroke="url(#gradPrimary)" stroke-linecap="round" stroke-linejoin="round">
